<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0d10" />
<title>LUCA · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css?v=1" />
</head>
<body>

<div id="admin-root" data-loading="true">
  <div class="boot"><div class="boot__dot"></div></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.46.1';
  window.__SB_createClient = createClient;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<script>
(async function bootAdmin() {
  // Wait for ESM module to set the global (rare race in cold loads)
  for (let i = 0; i < 50 && !window.__SB_createClient; i++) await new Promise(r => setTimeout(r, 30));
  let cfg;
  try {
    const r = await fetch('/.netlify/functions/public-config');
    cfg = await r.json();
  } catch (e) {
    document.getElementById('admin-root').innerHTML = '<div class="boot-error">Cannot reach API. Configure Supabase env in Netlify.</div>';
    return;
  }
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.__SB_createClient) {
    document.getElementById('admin-root').innerHTML = '<div class="boot-error">Missing Supabase configuration. Set SUPABASE_URL and SUPABASE_ANON_KEY in Netlify env vars.</div>';
    return;
  }
  window.LUCA_supabase = window.__SB_createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
    auth: { persistSession: true, storage: window.localStorage, storageKey: 'luca-admin-auth' },
  });
  // Load app
  const s = document.createElement('script');
  s.src = 'admin.js?v=1';
  s.onload = () => window.LUCA_mountAdmin && window.LUCA_mountAdmin();
  document.body.appendChild(s);
})();
</script>

</body>
</html>
