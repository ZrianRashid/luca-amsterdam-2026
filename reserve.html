<link rel="stylesheet" href="styles.css">
<style>
body { background: var(--cream); color: var(--dark); }

.page-hero {
  position: relative;
  padding: 200px 48px 80px;
  border-bottom: 1px solid var(--line);
  background: var(--cream);
  overflow: hidden;
}

.page-hero__inner {
  position: relative;
  z-index: 2;
  max-width: 1600px;
  margin: 0 auto;
}

.page-hero__kicker {
  font-family: var(--ui);
  font-size: 11px;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.page-hero__kicker::before {
  content: "";
  width: 32px;
  height: 1px;
  background: var(--gold);
}

.page-hero__title {
  font-family: var(--display);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(56px, 8vw, 128px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--dark);
}

.page-hero__title em { color: var(--gold); font-style: italic; }

.page-hero__motion {
  position: absolute;
  inset: -10%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.4;
}

.page-hero__motion::before,
.page-hero__motion::after {
  content: "";
  position: absolute;
  inset: 0;
  background-repeat: no-repeat;
  filter: blur(80px);
}

.page-hero__motion::before {
  background-image: radial-gradient(ellipse at 80% 30%, rgba(201, 168, 108, 0.35), transparent 60%);
  animation: drift-a 32s cubic-bezier(0.22,0.61,0.36,1) infinite alternate;
}

.page-hero__motion::after {
  background-image: radial-gradient(ellipse at 20% 70%, rgba(196, 168, 130, 0.25), transparent 60%);
  animation: drift-b 44s cubic-bezier(0.22,0.61,0.36,1) infinite alternate;
}

@keyframes drift-a {
  0%   { transform: translate(-4%, -2%) scale(1.05) rotate(0deg); }
  100% { transform: translate(6%, 4%) scale(1.15) rotate(8deg); }
}
@keyframes drift-b {
  0%   { transform: translate(3%, -3%) scale(1.1) rotate(0deg); }
  100% { transform: translate(-5%, 5%) scale(1.2) rotate(-6deg); }
}

.book-section {
  padding: 100px 48px;
  max-width: 1600px;
  margin: 0 auto;
}

.book-label {
  font-family: var(--ui);
  font-size: 11px;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.book-label::before {
  content: "";
  width: 32px;
  height: 1px;
  background: var(--gold);
}

.book-iframe-wrap {
  border: 1px solid var(--gold-line);
  background: var(--cream-2);
  overflow: hidden;
}

.book-iframe-wrap iframe {
  width: 100%;
  min-height: 700px;
  border: none;
  display: block;
}

.book-fallback {
  padding: 80px 48px;
  text-align: center;
}

.book-fallback h2 {
  font-family: var(--display);
  font-style: italic;
  font-weight: 300;
  font-size: 40px;
  color: var(--dark);
  margin-bottom: 16px;
}

.book-fallback p {
  font-family: var(--body);
  font-size: 17px;
  color: var(--mute);
  margin-bottom: 32px;
}

.book-fallback a {
  font-family: var(--ui);
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--cream);
  background: var(--dark);
  padding: 18px 36px;
  text-decoration: none;
  display: inline-block;
  transition: background .5s var(--ease);
}

.book-fallback a:hover { background: var(--gold); color: var(--dark); }

.book-alt {
  padding: 48px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 40px;
  justify-content: center;
  font-family: var(--ui);
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.book-alt a {
  color: var(--gold);
  text-decoration: none;
  transition: opacity .4s var(--ease);
}

.book-alt a:hover { opacity: 0.7; }

@media (max-width: 900px) {
  .page-hero { padding: 160px 24px 60px; }
  .book-section { padding: 60px 24px; }
}
</style>
